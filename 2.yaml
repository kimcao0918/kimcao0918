#基础配置
tcp-concurrent: true        # TCP并发：允许并发连接TCP,提高并发性能
unified-delay: true         # 统一延迟：统一显示节点延迟
#性能调优
tcp-concurrent-users: 64      # TCP并发连接数,根据服务器性能调整,建议值:16-128
keep-alive-interval: 15       # 保活心跳间隔(秒),建议值:15-30
inbound-tfo: true            # 入站TCP Fast Open
outbound-tfo: true           # 出站TCP Fast Open
connection-pool-size: 256     # 连接池大小,建议值:128-512
idle-timeout: 60             # 空闲超时时间(秒)

## 常用变量
# 负载均衡 load-balance：
  # round-robin 将会把所有的请求分配给策略组内不同的代理节点
  # consistent-hashing 将相同的 目标地址 的请求分配给策略组内的同一个代理节点
  # sticky-sessions: 将相同的 来源地址 和 目标地址 的请求分配给策略组内的同一个代理节点，缓存 10 分钟过期
# 自动回退 fallback
# 常用字段：filter: "(?i)港|hk|hongkong|hong kong"   exclude-filter: "美|日" 
# 更多内容请参考：https://wiki.metacubex.one/config/proxy-groups/


# 机场
proxy-providers:
  机场:
    type: http
    path: ./profiles/proxy1.yaml
# 机场订阅链接 替换下面url的网址，中间要有空格，要clash可用的
    url: https://config.moe/config/123456789
    interval: 86400
    override:
      skip-cert-verify: true
      udp: true

