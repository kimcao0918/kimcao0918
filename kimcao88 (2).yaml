# 节点信息
proxies:
  - {name: 直连, type: direct}



# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
# interface-name: enp6s18
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
# 跑裸核朋友自行删除注释即可，使用nikki仅内核的ui路径改为/etc/nikki/run/ui
#external-controller: 0.0.0.0:9090
#secret: ""
#external-ui: "/etc/mihomo/ui"
#external-ui-name: zashboard
#external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# 入站  
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #使用仅内核自行修改下面三项为true
  #device: nikki
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    #- "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  # namesever尽量用运营商提供的DNS
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
 
# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
proxy-groups:
- name:  节点选择
  type: select
  proxies:
    -  延迟选优
    -  负载均衡
    -  香港
    - 台湾
    - 新加坡
    - 日本
    -  美国
    -  韩国   
    - DIRECT  
  icon: https://raw.githubusercontent.com/kimcao0918/Qureicon/refs/heads/master/IconSet/Color/Rocket.png
 
- name:  延迟选优
  type: url-test
  use:
    - 良心云
    - 萌新云
    - Kit
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: false
  exclude-filter: "剩余|距离|套餐|过期|到期|个人|官网"
  icon: https://raw.githubusercontent.com/kimcao0918/Qureicon/refs/heads/master/IconSet/Color/Auto.png

- name:  日亚刮削
  type: load-balance
  use:
    - 良心云
    - Kit
    - 萌新云
  url: https://www.dmm.co
  interval: 1800
  tolerance: 50
  expected-status: 200/301/302/304
  strategy: round-robin
  filter: "日|Ja"
  icon: https://raw.githubusercontent.com/kimcao0918/icon/refs/heads/main/svg/Under18.svg

- name:  AVBase
  type: load-balance
  proxies:
    -  香港
    -  台湾
    -  新加坡
    - 日本
    - 美国
  url: https://www.avbase.net
  interval: 300
  tolerance: 50
  expected-status: 200/301/302/304
  strategy: round-robin
  #exclude-filter: "vip"
#  filter: "香|Ho"
  icon: https://raw.githubusercontent.com/kimcao0918/icon/refs/heads/main/png/DMM.png
 
