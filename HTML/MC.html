.ios-switch{

<body>

<div class="container">

<h1>门窗下料算料助手</h1>

<div class="top-row">

<div class="select-box">

<label for="modeDropdown">
计算模式
</label>

<select id="modeDropdown">

<option value="4" selected>
4块 (左右分格+上亮)
</option>

<option value="3">
3块 (右开扇+通头顶上亮)
</option>

<option value="double">
双扇 (两边开扇+中间固定)
</option>

<option value="balcony">
阳台
</option>

</select>

</div>

<div class="num-box">

<label>
数量 (套)
</label>

<div class="num-control">

<button type="button" id="minusNum">
−
</button>

<input type="number"
id="winNum"
value="1"
min="1">

<button type="button" id="plusNum">
+
</button>

</div>

</div>

</div>


<!-- 3块 / 双扇 专用切换按钮 -->

<div class="mode-switch-row"
id="modeSwitchRow">

<button type="button"
class="mode-switch-btn"
id="modeSwitchButton">
切换左通
</button>

</div>


<!-- 阳台 固 / 扇 -->

<div class="balcony-add-row"
id="balconyAddRow">

<button type="button"
class="balcony-add-btn fixed"
id="addFixedButton">
＋ 固
</button>

<button type="button"
class="balcony-add-btn fan"
id="addFanButton">
＋ 扇
</button>

</div>


<div class="action-row">

<button type="button"
class="action-btn green"
id="exportButton">
导出玻璃
</button>

<button type="button"
class="action-btn blue"
id="addListButton">
加入清单
</button>

<button type="button"
class="action-btn orange"
id="listButton">
整理清单
</button>

<button type="button"
class="action-btn purple"
id="historyButton">
历史记录
</button>

</div>


<div class="action-panel"
id="listPanel">

<div class="panel-title">

<span>
整理清单
</span>

<div class="panel-title-actions">

<button type="button"
class="list-edit-btn"
id="listEditButton">
编辑
</button>

<button type="button"
class="clear-panel-btn"
id="clearListButton">
清空清单
</button>

</div>

</div>

<div id="listContent"></div>

</div>


<div class="history-panel"
id="historyPanel">

<div class="panel-title">

<span>
历史记录
</span>

<div class="panel-title-actions">

<button type="button"
class="history-edit-btn"
id="historyEditButton">
编辑
</button>

<button type="button"
class="clear-panel-btn"
id="clearHistoryButton">
清空历史
</button>

</div>

</div>

<div id="historyContent"></div>

</div>


<div class="diagram-container">

<div class="diagram-title-row">

<button type="button"
id="diagramToggle"
class="diagram-toggle">
收起图示
</button>

</div>

<div class="diagram-wrapper"
id="diagramWrapper"></div>

<div class="area-display-box">

<div class="area-info-row">

<div class="area-info-item">

<div class="area-title">
窗户总面积
</div>

<div class="area-val-wrapper">

<span id="areaNum"
class="area-num">
-
</span>

<span id="areaUnit"
class="area-unit">
</span>

</div>

</div>


<div class="area-info-item">

<div class="perimeter-title">

包边

<label class="ios-switch">

<input type="checkbox"
id="perimeterToggle">

<span class="ios-slider"></span>

</label>

</div>

<div id="perimeterDisplay"
class="perimeter-display">

<span id="perimeterNum"
class="perimeter-num">
-
</span>

<span class="perimeter-unit">
米
</span>

</div>

</div>

</div>

</div>

</div>


<div class="input-group">

<div class="input-box">

<label>
窗总高
</label>

<input type="number"
id="winH">

</div>


<div class="input-box">

<label>
窗总宽
</label>

<input type="number"
id="winW">

</div>


<div class="input-box"
id="fanWBox">

<label>
扇子宽
</label>

<input type="number"
id="fanW">

</div>


<div class="input-box"
id="fanHBox">

<label>
扇子高
</label>

<input type="number"
id="fanH">

</div>


<div class="input-box hidden"
id="upperBrightBox">

<label>
上亮高度
</label>

<input type="number"
id="upperBright">

</div>


<div class="input-box hidden"
id="lowerBrightBox">

<label>
下亮高度
</label>

<input type="number"
id="lowerBright">

</div>

</div>


<div class="glass-section">

<button type="button"
class="glass-toggle"
id="glassToggle">
展开玻璃尺寸
</button>


<div class="glass-table-wrap"
id="glassTableWrap">

<table>

<tbody id="resultTable">


<tr id="rowG1">

<td id="label1">
下固定玻璃
