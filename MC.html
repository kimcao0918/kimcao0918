<head>
    <meta charset="UTF-8">

    <!-- 手机自适应 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- iPhone 添加到主屏幕后全屏运行 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="门窗计算">

    <!-- Android / PWA -->
    <meta name="theme-color" content="#4CAF50">

    <!-- 图标 -->
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" href="icon-180.png">

    <title>门窗玻璃计算器</title>

    <style>
        :root { --bg-color: #f0f2f5; --card-bg: #ffffff; --text-main: #333; --accent: #4CAF50; --input-bg: #f8f8f8; }
        @media (prefers-color-scheme: dark) {
            :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #fff; --accent: #66bb6a; --input-bg: #2d2d2d; }
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 100%; margin: auto; }
        h1 { text-align: center; font-size: 1.5rem; color: var(--accent); margin-bottom: 20px; }
        .mode-select { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-select button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; background: #ddd; color: #333; }
        .mode-select button.active { background: var(--accent); color: white; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .input-box { background: var(--card-bg); padding: 15px; border-radius: 12px; text-align: center; }
        .input-box label { display: block; font-size: 0.9rem; color: #888; margin-bottom: 8px; font-weight: bold; }
        .input-box input { width: 90%; padding: 12px; border: none; background: var(--input-bg); color: var(--text-main); font-size: 1.4rem; font-weight: 800; border-radius: 8px; text-align: center; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        td { background: var(--card-bg); padding: 20px; text-align: center; font-size: 1.3rem; font-weight: 800; border: 1px solid rgba(0,0,0,0.1); }
        td:first-child { border-radius: 12px 0 0 12px; color: var(--accent); width: 45%; font-size: 1rem; }
        td:last-child { border-radius: 0 12px 12px 0; }
        .hidden { display: none; }
    </style>
</head>
