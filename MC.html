<body>

<div class="container">

<h1>门窗下料算料助手</h1>

<div class="top-row">

<div class="select-box">
<label for="modeDropdown">计算模式</label>

<select id="modeDropdown">
<option value="4" selected>4块 (左右分格+上亮)</option>
<option value="3">3块 (右开扇+通头顶上亮)</option>
<option value="tonggao">3块 (左通高大玻璃+右开扇)</option>
<option value="double">双扇 (两边开扇+中间固定)</option>
<option value="balcony">阳台 (固+扇+固)</option>
<option value="balcony2">阳台 (固+扇+固+扇)</option>
</select>

</div>

<div class="num-box">
<label>数量 (套)</label>

<div class="num-control">
<button type="button" id="minusNum">−</button>
<input type="number" id="winNum" value="1" min="1">
<button type="button" id="plusNum">+</button>
</div>

</div>

</div>

<div class="action-row">

<button type="button" class="action-btn green" id="exportButton">
导出玻璃
</button>

<button type="button" class="action-btn blue" id="addListButton">
加入清单
</button>

<button type="button" class="action-btn orange" id="listButton">
整理清单
</button>

<button type="button" class="action-btn purple" id="historyButton">
历史记录
</button>

</div>

<div class="action-panel" id="listPanel">

<div class="panel-title">

<span>整理清单</span>

<div class="panel-title-actions">

<button type="button" class="list-edit-btn" id="listEditButton">
编辑
</button>

<button type="button" class="clear-panel-btn" id="clearListButton">
清空清单
</button>

</div>

</div>

<div id="listContent"></div>

</div>

<div class="history-panel" id="historyPanel">

<div class="panel-title">

<span>历史记录</span>

<div class="panel-title-actions">

<button type="button" class="history-edit-btn" id="historyEditButton">
编辑
</button>

<button type="button" class="clear-panel-btn" id="clearHistoryButton">
清空历史
</button>

</div>

</div>

<div id="historyContent"></div>

</div>

<div class="diagram-container">

<div class="diagram-title-row">

<button type="button" id="diagramToggle" class="diagram-toggle">
收起图示
</button>

</div>

<div class="diagram-wrapper" id="diagramWrapper"></div>

<div class="area-display-box">

<div class="area-info-row">

<div class="area-info-item">

<div class="area-title">
窗户总面积
</div>

<div class="area-val-wrapper">

<span id="areaNum" class="area-num">-</span>

<span id="areaUnit" class="area-unit"></span>

</div>

</div>

<div class="area-info-item">

<div class="perimeter-title">

包边

<label class="ios-switch">

<input type="checkbox" id="perimeterToggle">

<span class="ios-slider"></span>

</label>

</div>

<div id="perimeterDisplay" class="perimeter-display">

<span id="perimeterNum" class="perimeter-num">-</span>

<span class="perimeter-unit">米</span>

</div>

</div>

</div>

</div>

</div>

<div class="input-group">

<div class="input-box">
<label>窗总高</label>
<input type="number" id="winH">
</div>

<div class="input-box">
<label>窗总宽</label>
<input type="number" id="winW">
</div>

<div class="input-box" id="fanWBox">
<label>扇子宽</label>
<input type="number" id="fanW">
</div>

<div class="input-box" id="fanHBox">
<label>扇子高</label>
<input type="number" id="fanH">
</div>

<div class="input-box hidden" id="upperBrightBox">
<label>上亮高度</label>
<input type="number" id="upperBright">
</div>

<div class="input-box hidden" id="lowerBrightBox">
<label>下亮高度</label>

展开玻璃尺寸
</button>

<table>

<tbody id="resultTable">

<tr id="rowG1">
<td id="label1">下固定玻璃</td>
<td>
<div class="result-cell">
<span id="g1_size" class="size-val">-</span>
<span id="g1_count" class="count-val"></span>
</div>
</td>
</tr>

<tr id="rowBright">

<div class="result-cell">

<span id="g2_count" class="count-val"></span>
</div>
</td>
</tr>

<td id="label3">上亮扇固定玻璃</td>
<td>
<div class="result-cell">
<span id="g3_size" class="size-val">-</span>
<span id="g3_count" class="count-val"></span>
</div>
</td>
</tr>

<tr id="rowG4">
<td id="label4">扇子玻璃</td>
<td>
<div class="result-cell">
<span id="g4_size" class="size-val">-</span>
<span id="g4_count" class="count-val"></span>
</div>
</td>
</tr>

<tr id="rowLowerFan" class="hidden">
<td id="label5">下亮固扇玻璃</td>
<td>
<div class="result-cell">
<span id="g5_size" class="size-val">-</span>
<span id="g5_count" class="count-val"></span>
</div>
</td>
</tr>

<tr id="rowSash" class="hidden">
<td id="label6">扇子玻璃</td>
<td>
<div class="result-cell">
<span id="g6_size" class="size-val">-</span>
<span id="g6_count" class="count-val"></span>
</div>
</td>
</tr>

<tr id="rowScreen" class="screen-row">
<td id="labelScreen">纱窗尺寸</td>
<td>
<div class="result-cell">
<span id="gScreen_size" class="size-val">-</span>
<span id="gScreen_count" class="count-val"></span>
</div>
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

<script>

const data={
4:{winW:1800,winH:1800,fanW:540,fanH:1160,winNum:1},
3:{winW:1800,winH:1800,fanW:540,fanH:1160,winNum:1},
tonggao:{winW:1800,winH:1800,fanW:540,fanH:1160,winNum:1},
double:{winW:2040,winH:1800,fanW:540,fanH:1160,winNum:1},
balcony:{winW:2800,winH:2880,fanW:540,fanH:1370,upperBright:551,lowerBright:801,winNum:1},
balcony2:{winW:3620,winH:2880,fanW:540,fanH:1370,upperBright:551,lowerBright:801,winNum:1}
};

let currentMode=4;
let diagramCollapsed=false;
let glassCollapsed=true;
let historyEditMode=false;
let listEditMode=false;

let shoppingList=JSON.parse(localStorage.getItem('windowShoppingList')||'[]');
let historyList=JSON.parse(localStorage.getItem('windowHistoryList')||'[]');

function $(id){
return document.getElementById(id)
}

function escapeHtml(str){
return String(str||'')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;')
}

function clearInputOnClick(i){
if(!i.dataset.clicked){
i.dataset.clicked='1';
i.value='';
i.dispatchEvent(new Event('input'));
setTimeout(()=>{
delete i.dataset.clicked
},300)
}
}

function changeNum(delta){
let n=parseInt($('winNum').value)||1;
n=Math.max(1,n+delta);
$('winNum').value=n;
calc()
}

diagramCollapsed=!diagramCollapsed;

function getValues(){
const read=(id,oldValue)=>{
const el=$(id);
if(el){
return +el.value||0
}
return +oldValue||0
};

const d=data[currentMode]||{};

return{
W:read('winW',d.winW),
H:read('winH',d.winH),
FW:read('fanW',d.fanW),
FH:read('fanH',d.fanH),
upperBright:read('upperBright',d.upperBright),
lowerBright:read('lowerBright',d.lowerBright)
}
}

function svgHeader(){
return`<defs>
<marker id="arrow" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto-start-reverse">
<path d="M 0 0 L 5 2.5 L 0 5 z" fill="var(--text-main)"/>
</marker>
</defs>`
}

function verticalDimension(x,y1,y2,text,guideX){
return`<line class="dimension-line" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="dimension-dash" x1="${x+5}" y1="${y1}" x2="${guideX}" y2="${y1}"/>
<line class="dimension-dash" x1="${x+5}" y1="${y2}" x2="${guideX}" y2="${y2}"/>
<text class="dimension-text" x="${x-10}" y="${(y1+y2)/2}">${text}</text>`
}

function totalHeightDimension(x,y1,y2,text,guideX){
return`<line class="dimension-line" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="dimension-dash" x1="${guideX}" y1="${y1}" x2="${x-5}" y2="${y1}"/>
<line class="dimension-dash" x1="${guideX}" y1="${y2}" x2="${x-5}" y2="${y2}"/>
<text class="dimension-text" x="${x+10}" y="${(y1+y2)/2}">${text}</text>`
}

function horizontalDimension(x1,x2,y,text,guideY){
return`<line class="dimension-line" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line class="dimension-dash" x1="${x1}" y1="${guideY}" x2="${x1}" y2="${y-5}"/>
<line class="dimension-dash" x1="${x2}" y1="${guideY}" x2="${x2}" y2="${y-5}"/>
<text class="dimension-text" x="${(x1+x2)/2}" y="${y+9}">${text}</text>`
}

function getBalconyGeometry(){
const{W,H,FW,upperBright,lowerBright}=getValues();
const isDouble=currentMode==='balcony2';
const fanCount=isDouble?2:1;
const fixedCount=2;
const totalInnerH=H-100-upperBright-lowerBright-29-29;
const mainFixedH=totalInnerH-10;
const sashH=totalInnerH-82;
const fixedW=Math.floor((W-100-FW*fanCount-29-29-29)/fixedCount)-10;

return{
W,H,FW,upperBright,lowerBright,fanCount,fixedCount,totalInnerH,mainFixedH,sashH,fixedW
}
}

function drawModeBalcony(){
const g=getBalconyGeometry();
const{W,H,FW,upperBright,lowerBright,fixedW,totalInnerH}=g;
const widthRatio=W||1;
const heightRatio=H||1;

let drawW=150;
let drawH=drawW*(heightRatio/widthRatio);

if(drawH>125){
drawH=125;
drawW=drawH*(widthRatio/heightRatio)
}

const frameX=(220-drawW)/2;
const frameY=18;
const frameBottom=frameY+drawH;
const frameLeft=frameX+drawW*(50/W);
const frameRight=frameX+drawW*((W-50)/W);
const fixedDrawW=drawW*(fixedW/W);
const fanDrawW=drawW*(FW/W);
const leftFixedX=frameLeft;
const fanX=leftFixedX+fixedDrawW;
const rightFixedX=fanX+fanDrawW;
const upperY=frameY+drawH*((100+upperBright)/H);
const fanBottomY=upperY+drawH*(totalInnerH/H);
const arrowX=fanX+fanDrawW/2;

$('diagramWrapper').innerHTML=
`<svg class="svg-canvas" viewBox="0 0 220 180">
${svgHeader()}
<rect x="${frameX}" y="${frameY}" width="${drawW}" height="${drawH}"/>
<line x1="${frameLeft}" y1="${upperY}" x2="${frameRight}" y2="${upperY}"/>
<line x1="${frameLeft}" y1="${fanBottomY}" x2="${frameRight}" y2="${fanBottomY}"/>
<line x1="${fanX}" y1="${frameY}" x2="${fanX}" y2="${frameBottom}"/>
<line x1="${rightFixedX}" y1="${frameY}" x2="${rightFixedX}" y2="${frameBottom}"/>
<polyline points="${arrowX+12},${upperY+(fanBottomY-upperY)/2-18} ${arrowX-5},${upperY+(fanBottomY-upperY)/2} ${arrowX+12},${upperY+(fanBottomY-upperY)/2+18}"/>
${verticalDimension(12,frameY,upperY,Math.round(upperBright),frameLeft)}
${verticalDimension(12,upperY,fanBottomY,Math.round(totalInnerH),frameLeft)}
${verticalDimension(12,fanBottomY,frameBottom,Math.round(lowerBright),frameLeft)}
${totalHeightDimension(208,frameY,frameBottom,Math.round(H),frameRight)}
${horizontalDimension(frameX,frameX+drawW,165,Math.round(W),frameBottom)}
</svg>`
}

}

['g1','g2','g3','g4','g5','g6','gScreen'].forEach(id=>{

$(id+'_count').innerText=''
})
}

function calc(){

if(currentMode==='balcony'||currentMode==='balcony2'){

const totalH=+$('winH').value||0;
const uB=+$('upperBright').value||0;
const lB=+$('lowerBright').value||0;
const fH=+$('fanH').value||0;

if(totalH>0){

const active=document.activeElement;

if(active===$('fanH')){

const computedLB=totalH-100-29-29-uB-fH;

if(computedLB>0){
$('lowerBright').value=Math.round(computedLB)
}

}else if(active===$('upperBright')||active===$('lowerBright')){

const computedFH=totalH-100-29-29-uB-lB;

if(computedFH>0){
$('fanH').value=Math.round(computedFH)
}

}else{

if(uB>0&&lB>0&&active!==$('fanH')){

const computedFH=totalH-100-29-29-uB-lB;

if(computedFH>0){
$('fanH').value=Math.round(computedFH)
}

}

}

}

}

saveCurrentData();
clearResults();

const{W,H,FW,FH,upperBright,lowerBright}=getValues();
const num=parseInt($('winNum').value)||1;

drawDiagram();

$('areaNum').innerText=((W*H*num)/1e6).toFixed(2);
$('areaUnit').innerText='m² (共 '+num+' 套)';
$('perimeterNum').innerText=(((H+W)/1000)*2*num).toFixed(2);

if(currentMode==='balcony'||currentMode==='balcony2'){

const g=getBalconyGeometry();
const{fixedW,mainFixedH,sashH,fanCount,fixedCount}=g;

showResult('g1',Math.floor(fixedW)+'×'+Math.floor(mainFixedH),num*fixedCount,'块');
showResult('g2',Math.floor(fixedW)+'×'+Math.floor(upperBright-10),num*fixedCount,'块');
showResult('g3',Math.floor(fixedW)+'×'+Math.floor(lowerBright-10),num*fixedCount,'块');
showResult('g4',Math.floor(FW-10)+'×'+Math.floor(upperBright-10),num*fanCount,'块');
showResult('g5',Math.floor(FW-10)+'×'+Math.floor(lowerBright-10),num*fanCount,'块');
showResult('g6',Math.floor(FW-93)+'×'+Math.floor(sashH),num*fanCount,'块');
showResult('gScreen',Math.floor(FH-45)+'×'+Math.floor(FW-45),num*fanCount,'个');

return
}

const gW=W-100-FW-29-10;
const gH=H-100-FH-29-10;

if(currentMode==='double'){

showResult('g2',Math.round(((W-100-29)/2)-10)+'×'+Math.round(gH),num*2,'块');
showResult('g1',Math.round(W-100-2*FW-29-29-10)+'×'+Math.round(FH-10),num,'块');
showResult('g4',Math.round(FW-93)+'×'+Math.round(FH-92),num*2,'块');
showResult('gScreen',Math.round(FH-45)+'×'+Math.round(FW-45),num*2,'个')

}else if(currentMode==='tonggao'){

showResult('g1',Math.round(gW)+'×'+Math.round(H-110),num,'块');
showResult('g2',Math.round(FW-10)+'×'+Math.round(gH),num,'块');
showResult('g4',Math.round(FW-93)+'×'+Math.round(FH-92),num,'块');
showResult('gScreen',Math.round(FH-45)+'×'+Math.round(FW-45),num,'个')

}else{

showResult('g1',Math.round(gW)+'×'+Math.round(FH-10),num,'块');
showResult('g4',Math.round(FW-93)+'×'+Math.round(FH-92),num,'块');
showResult('gScreen',Math.round(FH-45)+'×'+Math.round(FW-45),num,'个');

if(currentMode===4){

showResult('g2',Math.round(gW)+'×'+Math.round(gH),num,'块');
showResult('g3',Math.round(FW-10)+'×'+Math.round(gH),num,'块')

}else{

showResult('g2',Math.round(W-110)+'×'+Math.round(gH),num,'块')

}

}

}

function getCurrentResults(){

const result=[];

const rows=[
'rowG1',
'rowBright',
'rowBrightFan',
'rowG4',
'rowLowerFan',
'rowSash',
'rowScreen'
];

rows.forEach(id=>{

const row=$(id);

if(!row||row.classList.contains('hidden'))return;

const size=row.querySelector('.size-val');
const count=row.querySelector('.count-val');

if(size&&size.innerText&&size.innerText!=='-'){

result.push({
name:row.querySelector('td').innerText.trim(),
size:size.innerText.trim(),
count:count?count.innerText.trim():''
})

}

});

return result
}

function addToList(){

saveCurrentData();

const Glen=getCurrentResults();

if(!Glen.length)return;

const item={
id:Date.now(),
mode:$('modeDropdown').selectedOptions[0].text,
modeValue:currentMode,
W:data[currentMode].winW,
H:data[currentMode].winH,
FW:data[currentMode].fanW,
FH:data[currentMode].fanH,
upperBright:data[currentMode].upperBright,
lowerBright:data[currentMode].lowerBright,
num:parseInt(data[currentMode].winNum)||1,
time:new Date().toLocaleString(),
results:Glen,
tag:''
};

shoppingList.push(item);
historyList.unshift(item);

if(shoppingList.length>100)shoppingList.shift();
if(historyList.length>100)historyList.pop();

localStorage.setItem('windowShoppingList',JSON.stringify(shoppingList));
localStorage.setItem('windowHistoryList',JSON.stringify(historyList));

renderList();
renderHistory();

alert('已加入清单');
}

function renderList(){

const box=$('listContent');

if(!shoppingList.length){

box.innerHTML='<div class="panel-empty">暂无清单内容</div>';

return
}

box.innerHTML='';

shoppingList.forEach(item=>{

const div=document.createElement('div');

div.className='list-item';

let html='';

item.results.forEach(r=>{

html+=`${escapeHtml(r.name)}：${escapeHtml(r.size)} ${escapeHtml(r.count)}<br>`

});

const num=item.num||1;

const tag=listEditMode
?`<input class="list-tag-input" data-id="${item.id}" value="${escapeHtml(item.tag||'')}" placeholder="输入标签">`
:item.tag
?`<span class="list-tag">${escapeHtml(item.tag)}</span>`
:'';

div.innerHTML=`

<button type="button" class="delete-btn" data-id="${item.id}">×</button>

<div class="list-item-title">

${tag}${escapeHtml(item.mode)}

<span class="item-size">高${item.H}×宽${item.W}×${num}个</span>

</div>

<div class="list-item-detail">

${html}

</div>

`;

box.appendChild(div)

});

box.querySelectorAll('.list-tag-input').forEach(input=>{

input.addEventListener('click',function(e){
e.stopPropagation()
});

input.addEventListener('input',function(){

const id=Number(this.dataset.id);
const item=shoppingList.find(i=>i.id===id);

if(item){

item.tag=this.value;
localStorage.setItem('windowShoppingList',JSON.stringify(shoppingList))

}

});

input.addEventListener('keydown',function(e){

if(e.key==='Enter'){
this.blur()
}

})

});

box.querySelectorAll('.delete-btn').forEach(btn=>{

btn.onclick=function(e){

e.stopPropagation();

const id=Number(this.dataset.id);

shoppingList=shoppingList.filter(i=>i.id!==id);

localStorage.setItem('windowShoppingList',JSON.stringify(shoppingList));

renderList()

}

})

}

function renderHistory(){

const box=$('historyContent');

if(!historyList.length){

box.innerHTML='<div class="panel-empty">暂无历史记录</div>';

return

}

box.innerHTML='';

historyList.forEach(item=>{

const div=document.createElement('div');

div.className='history-item';

let html='';

item.results.forEach(r=>{

html+=`${escapeHtml(r.name)}：${escapeHtml(r.size)} ${escapeHtml(r.count)}<br>`

});

const num=item.num||1;

const tag=historyEditMode
?`<input class="history-tag-input" data-id="${item.id}" value="${escapeHtml(item.tag||'')}" placeholder="输入标签">`
:item.tag
?`<span class="history-tag">${escapeHtml(item.tag)}</span>`
:'';

div.innerHTML=`

<button type="button" class="history-delete-btn" data-id="${item.id}">×</button>

<div class="history-item-title">

${tag}${escapeHtml(item.mode)}

<span class="item-size">高${item.H}×宽${item.W}×${num}个</span>

</div>

<div class="history-item-detail">

${escapeHtml(item.time)}<br>

${html}

</div>

`;

div.addEventListener('click',function(e){

if(historyEditMode)return;

if(e.target.closest('.history-delete-btn'))return;

restoreHistory(item)

});

box.appendChild(div)

});

box.querySelectorAll('.history-tag-input').forEach(input=>{

input.addEventListener('click',function(e){
e.stopPropagation()
});

input.addEventListener('input',function(){

const id=Number(this.dataset.id);

const item=historyList.find(i=>i.id===id);

if(item){

item.tag=this.value;

localStorage.setItem('windowHistoryList',JSON.stringify(historyList))

}

});

input.addEventListener('keydown',function(e){

if(e.key==='Enter'){
this.blur()
}

})

});

box.querySelectorAll('.history-delete-btn').forEach(btn=>{

btn.addEventListener('click',function(e){

e.stopPropagation();

const id=Number(this.dataset.id);

historyList=historyList.filter(i=>i.id!==id);

localStorage.setItem('windowHistoryList',JSON.stringify(historyList));

renderHistory()

})

})

}

function toggleListEdit(){

listEditMode=!listEditMode;

$('listEditButton').innerText=listEditMode?'完成':'编辑';

renderList()

}

function toggleHistoryEdit(){

historyEditMode=!historyEditMode;

$('historyEditButton').innerText=historyEditMode?'完成':'编辑';

renderHistory()

}

function toggleList(){

$('listPanel').classList.toggle('show');

$('historyPanel').classList.remove('show');

}

function toggleHistory(){

$('historyPanel').classList.toggle('show');

$('listPanel').classList.remove('show');

}

function clearList(){

shoppingList=[];

localStorage.setItem('windowShoppingList','[]');

renderList();

}

function clearHistory(){

historyList=[];

localStorage.setItem('windowHistoryList','[]');

renderHistory();

}

function exportGlassImage(){

saveCurrentData();

const glassList=getCurrentResults();

if(!glassList.length){

alert('暂无玻璃尺寸');

return

}

const sourceSvg=$('diagramWrapper').querySelector('svg');

if(!sourceSvg){

alert('暂无窗型图');

return

}

const svgClone=sourceSvg.cloneNode(true);

svgClone.setAttribute('xmlns','http://www.w3.org/2000/svg');
svgClone.setAttribute('width','220');
svgClone.setAttribute('height','180');

let svgText=new XMLSerializer().serializeToString(svgClone);

svgText=svgText.replace(/var\(--text-main\)/g,'#333');

svgText=svgText.replace(/<defs>/,

`<style>
.svg-canvas rect{fill:#fff;stroke:#333;stroke-width:2}
.svg-canvas line{stroke:#333;stroke-width:2}
.svg-canvas polyline{fill:none;stroke:#333;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dimension-line{stroke:#333;stroke-width:1.2;fill:none}
.dimension-dash{stroke:#333;stroke-width:1;stroke-dasharray:3 3;fill:none}
.dimension-text{fill:#333;font-family:Arial,sans-serif;font-size:8px;font-weight:400;letter-spacing:-.3px;text-anchor:middle;dominant-baseline:middle}
</style><defs>`);

const canvas=document.createElement('canvas');

const canvasW=1800;
const cardH=150;
const gap=20;
const cardTop=60;
const cardsHeight=glassList.length*cardH+(glassList.length-1)*gap;
const diagramW=700;
const diagramH=diagramW*(180/220);
const canvasH=Math.max(1100,Math.ceil(Math.max(cardsHeight,diagramH)+120));

canvas.width=canvasW*2;
canvas.height=canvasH*2;

const ctx=canvas.getContext('2d');

ctx.scale(2,2);
ctx.fillStyle='#fff';
ctx.fillRect(0,0,canvasW,canvasH);

const img=new Image();

const svgBlob=new Blob([svgText],{type:'image/svg+xml;charset=utf-8'});
const url=URL.createObjectURL(svgBlob);

img.onload=()=>{

const diagramX=50;
const diagramY=60+(Math.max(cardsHeight,diagramH)-diagramH)/2;

ctx.drawImage(img,diagramX,diagramY,diagramW,diagramH);

const cardX=820;
const cardW=930;

glassList.forEach((item,i)=>{

const y=cardTop+i*(cardH+gap);
const isScreen=item.name.includes('纱窗');

ctx.save();

ctx.strokeStyle=isScreen?'#ff9800':'#e3e3e3';
ctx.lineWidth=2;

ctx.beginPath();
ctx.roundRect(cardX,y,cardW,cardH,26);
ctx.stroke();

ctx.fillStyle=isScreen?'#ff9800':'#333';
ctx.font='900 68px Arial,sans-serif';
ctx.textAlign='center';
ctx.textBaseline='middle';

ctx.fillText(item.size,cardX+cardW/2-35,y+cardH/2);

ctx.fillStyle=isScreen?'#ff9800':'#666';
ctx.font='800 38px Arial,sans-serif';
ctx.textAlign='right';

ctx.fillText(item.count,cardX+cardW-35,y+cardH/2);

if(isScreen){

ctx.fillStyle='#ff9800';
ctx.font='900 34px Arial,sans-serif';
ctx.textAlign='left';

ctx.fillText('纱窗',cardX+35,y+cardH/2)

}

ctx.restore()

});

URL.revokeObjectURL(url);

canvas.toBlob(async blob=>{

if(!blob){

alert('导出失败');

return

}

const file=new File([blob],'玻璃尺寸.png',{type:'image/png'});

if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){

try{

await navigator.share({
files:[file],
title:'玻璃尺寸'
});

}catch(e){}

}else{

const a=document.createElement('a');

a.download='玻璃尺寸.png';
a.href=URL.createObjectURL(blob);
a.click();

setTimeout(()=>URL.revokeObjectURL(a.href),1000);

}

},'image/png');

};

img.onerror=()=>{

URL.revokeObjectURL(url);

alert('导出失败');

};

img.src=url;

}
