<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>门窗玻璃计算器</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="门窗助手">
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22%E9%97%A8%E7%AA%97%E5%8A%A9%E6%89%8B%22,%22short_name%22:%22%E9%97%A8%E7%AA%97%E5%8A%A9%E6%89%8B%22,%22start_url%22:%22https://kimcao0918.github.io/kimcao0918/MC.html%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f0f2f5%22}">

    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="icon-180.png">
    <style>
        :root { --bg-color: #f0f2f5; --card-bg: #ffffff; --text-main: #333; --accent: #4CAF50; --input-bg: #f8f8f8; }
        @media (prefers-color-scheme: dark) {
            :root { --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #fff; --accent: #66bb6a; --input-bg: #2d2d2d; }
        }
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: calc(15px + env(safe-area-inset-top)) 20px 20px 20px; 
            user-select: none; 
        }
        .container { max-width: 100%; margin: auto; }
        h1 { text-align: center; font-size: 1.5rem; color: var(--accent); margin-bottom: 20px; }
        .mode-select { display: flex; gap: 8px; margin-bottom: 20px; }
        .mode-select button { flex: 1; padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; background: #ddd; color: #333; font-size: 0.9rem; }
        .mode-select button.active { background: var(--accent); color: white; }
        
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .input-box { background: var(--card-bg); padding: 15px; border-radius: 12px; text-align: center; }
        .input-box.full-width { grid-column: span 2; } 
        .input-box label { display: block; font-size: 0.9rem; color: #888; margin-bottom: 8px; font-weight: bold; }
        .input-box input { width: 90%; padding: 12px; border: none; background: var(--input-bg); color: var(--text-main); font-size: 1.4rem; font-weight: 800; border-radius: 8px; text-align: center; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; table-layout: fixed; }
        td { background: var(--card-bg); padding: 15px 10px; border: 1px solid rgba(0,0,0,0.1); vertical-align: middle; }
        td:first-child { 
            border-radius: 12px 0 0 12px; 
            color: var(--accent); 
            width: 33%; /* 稍微缩小左侧，给右侧腾出空间 */
            font-size: 0.95rem; 
            font-weight: 800;
            text-align: center; 
            word-break: break-all;
        }
        td:last-child { 
            border-radius: 0 12px 12px 0; 
            width: 67%;
        }
        
        /* 核心修改：防折行、防溢出排版 */
        .result-cell {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .size-val {
            flex-grow: 1;
            text-align: center;
            font-weight: 800;
            font-size: 1.2rem; /* 稍微调小字号，确保不溢出 */
            white-space: nowrap; /* 强制单行显示，禁止换行 */
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .count-val {
            font-size: 0.95rem;
            font-weight: 800;
            color: #666;
            min-width: 48px;
            text-align: right;
            white-space: nowrap; /* 数量也禁止换行 */
        }
        @media (prefers-color-scheme: dark) {
            .count-val { color: #aaa; }
        }

        .hidden { display: none; }
        
        /* 纱窗行样式 */
        .screen-row td:first-child { 
            color: #ff9800; 
        } 
        .screen-row .result-cell {
            font-style: italic;
        }
        .screen-row .count-val {
            font-style: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>门窗下料算料助手</h1>
    <div class="mode-select">
        <button id="btn4" class="active" onclick="switchMode(4)">4 块模式</button>
        <button id="btn3" onclick="switchMode(3)">3 块模式</button>
        <button id="btnDouble" onclick="switchMode('double')">双扇模式</button>
    </div>
    <div class="input-group">
        <div class="input-box full-width" style="background: #eef9ee; border: 1px dashed var(--accent);"><label style="color: var(--accent);">窗户数量 (套)</label><input type="number" id="winNum" value="1" onclick="this.value=''" oninput="calc()"></div>
        <div class="input-box"><label>窗总高</label><input type="number" id="winH" onclick="this.value=''" oninput="calc()"></div>
        <div class="input-box"><label>窗总宽</label><input type="number" id="winW" onclick="this.value=''" oninput="calc()"></div>
        <div class="input-box"><label>扇子宽</label><input type="number" id="fanW" onclick="this.value=''" oninput="calc()"></div>
        <div class="input-box"><label>扇子高</label><input type="number" id="fanH" onclick="this.value=''" oninput="calc()"></div>
    </div>
    <table>
        <tbody id="resultTable">
            <tr><td id="label1">下固定玻璃</td><td><div class="result-cell"><span id="g1_size">-</span><span id="g1_count" class="count-val"></span></div></td></tr>
            <tr id="rowBright"><td id="label2">上亮固定玻璃</td><td><div class="result-cell"><span id="g2_size">-</span><span id="g2_count" class="count-val"></span></div></td></tr>
            <tr id="rowBrightFan"><td>上亮扇固定玻璃</td><td><div class="result-cell"><span id="g3_size">-</span><span id="g3_count" class="count-val"></span></div></td></tr>
            <tr><td id="label4">扇子玻璃</td><td><div class="result-cell"><span id="g4_size">-</span><span id="g4_count" class="count-val"></span></div></td></tr>
            <tr class="screen-row"><td id="labelScreen">纱窗尺寸</td><td><div class="result-cell"><span id="gScreen_size">-</span><span id="gScreen_count" class="count-val"></span></div></td></tr>
        </tbody>
    </table>
</div>

<script>
    let data = {
        4: { winW: 1800, winH: 1800, fanW: 540, fanH: 1160, winNum: 1 },
        3: { winW: 1800, winH: 1800, fanW: 540, fanH: 1160, winNum: 1 },
        'double': { winW: 2040, winH: 1800, fanW: 540, fanH: 1160, winNum: 1 }
    };
    let currentMode = 4;

    document.addEventListener('touchstart', function() {
        if (!window.navigator.standalone) {
            window.scrollTo(0, 1);
        }
    }, {passive: true});

    if (("standalone" in window.navigator) && window.navigator.standalone) {
        document.addEventListener('click', function(e) {
            let element = e.target;
            while (element && element.tagName !== 'A') {
                element = element.parentNode;
            }
            if (element && element.tagName === 'A' && element.hasAttribute('href')) {
                e.preventDefault();
                window.location.href = element.getAttribute('href');
            }
        }, false);
    }

    window.addEventListener('load', () => { setTimeout(() => window.scrollTo(0, 1), 100); });

    function switchMode(m) {
        saveCurrentData();
        currentMode = m;
        
        document.getElementById('btn4').className = (m === 4 ? 'active' : '');
        document.getElementById('btn3').className = (m === 3 ? 'active' : '');
        document.getElementById('btnDouble').className = (m === 'double' ? 'active' : '');
        
        if (m === 'double') {
            document.getElementById('rowBright').className = '';
            document.getElementById('rowBrightFan').className = 'hidden'; 
            document.getElementById('label1').innerText = "下中间玻璃";
            document.getElementById('label2').innerText = "上亮玻璃";
            document.getElementById('label4').innerText = "扇子玻璃";
            document.getElementById('labelScreen').innerText = "纱窗尺寸";
        } else if (m === 3) {
            document.getElementById('rowBright').className = '';
            document.getElementById('rowBrightFan').className = 'hidden';
            document.getElementById('label1').innerText = "下固定玻璃";
            document.getElementById('label2').innerText = "上亮玻璃";
            document.getElementById('label4').innerText = "扇子玻璃";
            document.getElementById('labelScreen').innerText = "纱窗尺寸";
        } else {
            document.getElementById('rowBright').className = '';
            document.getElementById('rowBrightFan').className = '';
            document.getElementById('label1').innerText = "下固定玻璃";
            document.getElementById('label2').innerText = "上亮固定玻璃";
            document.getElementById('label4').innerText = "扇子玻璃";
            document.getElementById('labelScreen').innerText = "纱窗尺寸";
        }
        
        loadDataToInputs();
        calc();
    }

    function saveCurrentData() {
        data[currentMode] = {
            winW: document.getElementById('winW').value,
            winH: document.getElementById('winH').value,
            fanW: document.getElementById('fanW').value,
            fanH: document.getElementById('fanH').value,
            winNum: document.getElementById('winNum').value
        };
    }

    function loadDataToInputs() {
        document.getElementById('winW').value = data[currentMode].winW;
        document.getElementById('winH').value = data[currentMode].winH;
        document.getElementById('fanW').value = data[currentMode].fanW;
        document.getElementById('fanH').value = data[currentMode].fanH;
        document.getElementById('winNum').value = data[currentMode].winNum || 1;
    }

    function showResult(id, sizeStr, countVal, unit) {
        const sizeEl = document.getElementById(id + '_size');
        const countEl = document.getElementById(id + '_count');
        
        if (sizeEl) {
            sizeEl.className = 'size-val';
            sizeEl.innerText = sizeStr;
        }
        if (countEl) {
            countEl.innerText = "*" + countVal + unit;
        }
    }

    function calc() {
        saveCurrentData();
        const W = parseFloat(data[currentMode].winW) || 0;
        const H = parseFloat(data[currentMode].winH) || 0;
        const FW = parseFloat(data[currentMode].fanW) || 0;
        const FH = parseFloat(data[currentMode].fanH) || 0;
        const num = parseInt(data[currentMode].winNum) || 1;

        const gW = W - 100 - FW - 29 - 10;
        const gH = H - 100 - FH - 29 - 10;

        // 去掉了乘号两边的空格，让其更紧凑，避免折行
        if (currentMode === 'double') {
            const doubleUpW = ((W - 100 - 29) / 2) - 10;
            showResult('g2', Math.round(doubleUpW) + "×" + Math.round(gH), num * 2, '块');

            const doubleMidW = W - 100 - (2 * FW) - 29 - 29 - 10;
            showResult('g1', Math.round(doubleMidW) + "×" + Math.round(FH - 10), num * 1, '块');
            
            showResult('g4', Math.round(FW - 93) + "×" + Math.round(FH - 92), num * 2, '块');
            showResult('gScreen', Math.round(FH - 45) + "×" + Math.round(FW - 45), num * 2, '个');

        } else {
            showResult('g1', Math.round(gW) + "×" + Math.round(FH - 10), num * 1, '块');
            showResult('g4', Math.round(FW - 93) + "×" + Math.round(FH - 92), num * 1, '块');
            showResult('gScreen', Math.round(FH - 45) + "×" + Math.round(FW - 45), num * 1, '个');

            if (currentMode === 4) {
                showResult('g2', Math.round(gW) + "×" + Math.round(gH), num * 1, '块');
                showResult('g3', Math.round(FW - 10) + "×" + Math.round(gH), num * 1, '块');
            } else {
                showResult('g2', Math.round(W - 100 - 10) + "×" + Math.round(gH), num * 1, '块');
            }
        }
    }
    loadDataToInputs();
    calc();
</script>
</body>
</html>
