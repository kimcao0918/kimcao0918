<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>N100 压制</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="N100压制">

    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIkRvY2tlciBOMTAwIHBvc3QtcHJvY2VzcyIsCiAgInNob3J0X25hbWUiOiAiTjEwMOWMieaYryIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGYxNzJhIiwKICAidGhlbWVfY29sb3IiOiAiIzBmMTcyYSIKfQ==">

    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='120' fill='%230f172a'/><path d='M380 200 C380 140 330 110 270 120 C240 80 170 90 150 140 C90 140 80 210 130 250 C110 290 150 340 210 330 C250 370 330 350 350 300 C390 280 400 220 380 200 Z' fill='%230284c7'/><circle cx='200' cy='210' r='12' fill='%23ffffff'/><path d='M350 280 Q380 260 410 285 Q390 310 350 280 Z' fill='%230284c7'/><path d='M160 380 L352 380' stroke='%2338bdf8' stroke-width='24' stroke-linecap='round'/><path d='M210 340 L160 380 L210 420' fill='none' stroke='%2338bdf8' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'/></svg>">

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-accent: #38bdf8;
            --input-bg: #0f172a;
            --input-border: #475569;
            --code-bg: #050505;
            --code-text: #4ade80;
            --btn-paste-bg: #334155;
            --btn-paste-text: #38bdf8;
            --btn-paste-hover: #0284c7;
            --btn-copy-bg: #0284c7;
            --btn-copy-hover: #0369a1;
            --note-bg: rgba(56, 189, 248, 0.1);
            --danger-bg: #dc2626;
            --success-bg: #16a34a;
            --warning-bg: #d97706;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-body: #f1f5f9;
                --bg-card: #ffffff;
                --border-color: #e2e8f0;
                --text-primary: #0f172a;
                --text-secondary: #64748b;
                --text-accent: #0284c7;
                --input-bg: #f8fafc;
                --input-border: #cbd5e1;
                --code-bg: #1e293b;
                --code-text: #4ade80;
                --btn-paste-bg: #e2e8f0;
                --btn-paste-text: #0284c7;
                --btn-paste-hover: #0284c7;
                --btn-copy-bg: #0284c7;
                --btn-copy-hover: #0369a1;
                --note-bg: #f0f9ff;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            padding-left: max(15px, env(safe-area-inset-left));
            padding-right: max(15px, env(safe-area-inset-right));
            transition: background-color 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        h2 {
            margin-top: 0;
            color: var(--text-accent);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            font-size: 20px;
        }

        .mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            background: var(--input-bg);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--input-border);
            flex-direction: column;
        }

        .mode-selector label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .time-group {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-direction: column;
        }

        .time-item {
            flex: 1;
        }

        .label-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .paste-btn-small {
            background-color: var(--btn-paste-bg);
            color: var(--btn-paste-text);
            border: 1px solid var(--input-border);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .paste-btn-small:hover {
            background-color: var(--btn-paste-hover);
            color: #ffffff;
            border-color: var(--btn-paste-hover);
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: var(--input-bg);
            color: var(--text-accent);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--text-accent);
        }

        #copyBtn {
            width: 100%;
            background-color: var(--btn-copy-bg);
            color: white;
            border: none;
            padding: 15px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        #copyBtn:hover {
            background-color: var(--btn-copy-hover);
        }

        #stopBtn {
            width: 100%;
            background-color: var(--danger-bg);
            color: white;
            border: none;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
            display: none;
        }

        #stopBtn:hover {
            opacity: 0.9;
        }

        textarea {
            width: 100%;
            height: 380px;
            padding: 12px;
            background-color: var(--code-bg);
            color: var(--code-text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            margin-top: 12px;
            line-height: 1.5;
            resize: vertical;
        }

        .note {
            background-color: var(--note-bg);
            border-left: 4px solid var(--text-accent);
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }

        .status-box {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
        }

        .status-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }

        #statusText {
            color: var(--text-accent);
        }

        #jobIdText {
            color: var(--text-secondary);
            font-size: 11px;
            font-family: monospace;
        }

        .progress-wrap {
            width: 100%;
            height: 7px;
            background: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: var(--text-accent);
            transition: width 0.3s;
        }

        .api-status {
            font-size: 11px;
            margin-top: 8px;
            color: var(--text-secondary);
        }

        .api-online {
            color: #22c55e;
        }

        .api-offline {
            color: #ef4444;
        }

        .mobile-help {
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🐳 Docker N100 压制控制台</h2>

    <div class="note" id="modeNote">
        💡 <b>智能转码：</b>
        点击「开始转码」后，网页直接调用 N100 Docker API，
        使用 Intel QSV 进行 H.265 硬件压制。
        只要新视频时长 ≥ 原视频80%，即安全清理原文件。
    </div>

    <!-- 模式选择 -->
    <div class="section-title">📂 处理模式选择：</div>

    <div class="mode-selector">

        <label>
            <input type="radio"
                   name="transcodeMode"
                   value="transcode"
                   checked
                   onchange="switchMode()">
            🎬 智能转码模式
            （H.265 QSV / AV1）
        </label>

        <label>
            <input type="radio"
                   name="transcodeMode"
                   value="cut"
                   onchange="switchMode()">
            ✂️ 视频截断模式
            （保留或删除指定区间）
        </label>

        <label>
            <input type="radio"
                   name="transcodeMode"
                   value="merge"
                   onchange="switchMode()">
            🧩 视频无损拼接模式
        </label>

    </div>


    <!-- 编码格式与质量 -->
    <div id="codecSection">

        <div class="section-title">
            ⚡ 编码格式与质量预设：
        </div>

        <div class="mode-selector">

            <div style="display:flex;gap:15px;flex-wrap:wrap;margin-bottom:4px;">

                <label>
                    <input type="radio"
                           name="codecMode"
                           value="h265"
                           checked
                           onchange="generateDockerCmd()">
                    🚀 H.265 / HEVC
                    （Intel QSV 硬件加速）
                </label>

                <label>
                    <input type="radio"
                           name="codecMode"
                           value="av1"
                           onchange="generateDockerCmd()">
                    ⚙️ AV1
                    （软件编码）
                </label>

            </div>

            <!-- 2倍帧率 -->
            <div style="margin-bottom:8px;">

                <label style="color:var(--text-accent);font-weight:bold;">

                    <input type="checkbox"
                           id="fps2x"
                           onchange="generateDockerCmd()">

                    ⏩ 开启 2倍帧率
                    （QSV VPP）

                </label>

            </div>

            <div style="width:100%;">

                <select id="qualityPreset"
                        onchange="generateDockerCmd()">

                    <option value="medium" selected>
                        ⚖️ 转换预设：中等画质（Q23）
                    </option>

                    <option value="quality">
                        🎨 转换预设：高画质（Q21）
                    </option>

                    <option value="size">
                        📦 转换预设：小体积（Q28）
                    </option>

                </select>

            </div>

        </div>

    </div>


    <!-- 截断 -->
    <div class="time-group"
         id="timeCutGroup"
         style="display:none;">

        <div class="section-title">
            ✂️ 裁剪选项：
        </div>

        <div class="mode-selector">

            <div style="display:flex;gap:15px;flex-wrap:wrap;">

                <label>
                    <input type="radio"
                           name="cutAction"
                           value="keep"
                           checked
                           onchange="generateDockerCmd()">

                    📌 保留该时间段
                </label>

                <label>
                    <input type="radio"
                           name="cutAction"
                           value="remove"
                           onchange="generateDockerCmd()">

                    🚫 删除该时间段
                </label>

            </div>

        </div>

        <div style="display:flex;gap:12px;">

            <div class="time-item">

                <label>
                    ⏱️ 起始时间：
                </label>

                <input type="text"
                       id="startTime"
                       value="00:00:00"
                       placeholder="例如 00:05:00"
                       oninput="generateDockerCmd()">

            </div>

            <div class="time-item">

                <label>
                    ⏱️ 结束时间：
                </label>

                <input type="text"
                       id="endTime"
                       value="00:15:35"
                       placeholder="例如 00:15:35"
                       oninput="generateDockerCmd()">

            </div>

        </div>

    </div>


    <!-- 输入路径 -->
    <div class="form-group">

        <div class="label-header">

            <label id="inputPathLabel">
                1. 原视频文件或文件夹路径：
            </label>

            <button class="paste-btn-small"
                    onclick="pasteToInput('inputPath')">
                📋 粘贴
            </button>

        </div>

        <input type="text"
               id="inputPath"
               value="/vol1/1000/live/抖音/星辰"
               oninput="syncAndUpdateDir()">

    </div>


    <!-- 输出路径 -->
    <div class="form-group"
         id="outputGroup">

        <label id="outputPathLabel">
            2. 转换后输出文件夹路径：
        </label>

        <input type="text"
               id="outputPath"
               value="/vol1/1000/live/抖音/星辰"
               oninput="generateDockerCmd()">

    </div>


    <!-- API状态 -->
    <div class="api-status"
         id="apiStatus">
        🔄 正在检测 N100 Docker API……
    </div>


    <!-- 开始 -->
    <button id="copyBtn"
            onclick="handleMainButton()">
        ▶️ 开始转码
    </button>


    <!-- 停止 -->
    <button id="stopBtn"
            onclick="stopCurrentJob()">
        ⛔ 停止当前任务
    </button>


    <!-- 状态 -->
    <div class="status-box"
         id="statusBox">

        <div class="status-title">

            <span id="statusText">
                等待任务……
            </span>

            <span id="jobIdText">
            </span>

        </div>

        <div class="progress-wrap">

            <div id="progressBar"></div>

        </div>

    </div>


    <!-- 日志 -->
    <textarea id="codeOutput"
              readonly
              placeholder="这里会显示 N100 实时压制日志……"></textarea>


    <div class="mobile-help">
        💡 当前网页直接连接：
        <b>192.168.2.216:3015</b>
        <br>
        🚀 H.265 使用 N100 Intel QSV 硬件编码。
        <br>
        🗑️ 压制完成且时长 ≥ 原视频80%后自动删除源文件。
    </div>

</div>


<script>

/* ============================================================
   N100 Docker API
   ============================================================ */

const API_BASE = "http://192.168.2.216:3015";

let currentJobId = null;
let pollTimer = null;
let isRunning = false;


/* ============================================================
   模式切换
   ============================================================ */

function switchMode() {

    const mode =
        document.querySelector(
            'input[name="transcodeMode"]:checked'
        ).value;

    const inputLabel =
        document.getElementById("inputPathLabel");

    const outputLabel =
        document.getElementById("outputPathLabel");

    const codecSection =
        document.getElementById("codecSection");

    const outputGroup =
        document.getElementById("outputGroup");

    const timeCutGroup =
        document.getElementById("timeCutGroup");

    const modeNote =
        document.getElementById("modeNote");

    const btn =
        document.getElementById("copyBtn");


    if (mode === "transcode") {

        codecSection.style.display = "block";
        outputGroup.style.display = "block";
        timeCutGroup.style.display = "none";

        inputLabel.innerText =
            "1. 原视频文件或文件夹路径：";

        outputLabel.innerText =
            "2. 转换后输出文件夹路径：";

        modeNote.innerHTML =
            "💡 <b>智能转码：</b> " +
            "点击「开始转码」后直接调用 N100 Docker API，" +
            "使用 Intel QSV 进行 H.265 硬件压制。";

        btn.innerText =
            "▶️ 开始转码";

    }


    else if (mode === "cut") {

        codecSection.style.display = "none";
        outputGroup.style.display = "block";
        timeCutGroup.style.display = "block";

        inputLabel.innerText =
            "1. 目标视频文件或文件夹路径：";

        outputLabel.innerText =
            "2. 截断输出文件夹路径：";

        modeNote.innerHTML =
            "💡 <b>视频截断：</b> " +
            "保留或删除指定时间段。";

        btn.innerText =
            "📋 复制截断命令";

    }


    else if (mode === "merge") {

        codecSection.style.display = "none";
        outputGroup.style.display = "none";
        timeCutGroup.style.display = "none";

        inputLabel.innerText =
            "1. 需要拼接视频的文件夹路径：";

        modeNote.innerHTML =
            "💡 <b>无损拼接：</b> " +
            "支持 MP4 / MKV / TS / FLV。";

        btn.innerText =
            "📋 复制拼接命令";

    }


    syncAndUpdateDir();

}


/* ============================================================
   粘贴
   ============================================================ */

async function pasteToInput(inputId) {

    try {

        const text =
            await navigator.clipboard.readText();

        if (text) {

            document.getElementById(inputId).value =
                text.trim();

            syncAndUpdateDir();

        }

    }

    catch (err) {

        alert("读取剪贴板失败，请手动粘贴。");

    }

}


/* ============================================================
   自动同步输出目录
   ============================================================ */

function syncAndUpdateDir() {

    const mode =
        document.querySelector(
            'input[name="transcodeMode"]:checked'
        ).value;

    const inPathVal =
        document.getElementById("inputPath")
        .value
        .trim();

    const isFile =
        /\.(mp4|ts|flv|mkv)$/i.test(inPathVal);


    if (mode === "merge" || !isFile) {

        document.getElementById("outputPath").value =
            inPathVal;

    }

    else {

        const lastSlashIndex =
            inPathVal.lastIndexOf("/");

        if (lastSlashIndex !== -1) {

            document.getElementById("outputPath").value =
                inPathVal.substring(0, lastSlashIndex);

        }

        else {

            document.getElementById("outputPath").value =
                inPathVal;

        }

    }

    generateDockerCmd();

}


/* ============================================================
   生成旧版 SSH 命令
   ============================================================ */

function generateDockerCmd() {

    const mode =
        document.querySelector(
            'input[name="transcodeMode"]:checked'
        ).value;

    const codec =
        document.querySelector(
            'input[name="codecMode"]:checked'
        ).value;

    const isFps2x =
        document.getElementById("fps2x").checked;

    const quality =
        document.getElementById("qualityPreset").value;

    const inPath =
        document.getElementById("inputPath")
        .value
        .trim();

    const outDir =
        document.getElementById("outputPath")
        .value
        .trim();

    const startTime =
        document.getElementById("startTime").value.trim();

    const endTime =
        document.getElementById("endTime").value.trim();

    const cutActionElement =
        document.querySelector(
            'input[name="cutAction"]:checked'
        );

    const cutAction =
        cutActionElement
            ? cutActionElement.value
            : "keep";


    /*
     * ==========================================================
     * MERGE
     * ==========================================================
     */

    if (mode === "merge") {

        const fullScript = `IN_DIR="${inPath}"
LIST="/tmp/concat_list.txt"

> "$LIST"

echo "========================================================="
echo "▶ 扫描待拼接文件"
echo "========================================================="

find "$IN_DIR" -maxdepth 1 -type f |
grep -E "\\.(mp4|ts|mkv|flv|MP4|TS|MKV|FLV)$" |
grep -v "_拼接\\." |
sort |
while read -r f; do

    echo "file '$f'" >> "$LIST"
    echo "➕ 已添加: $(basename "$f")"

done

if [ ! -s "$LIST" ]; then

    echo "❌ 没有找到视频文件"
    exit 1

fi

FIRST=$(head -n 1 "$LIST" | sed "s/file '//;s/'$//")

BASE_NAME=$(basename "\${FIRST%.*}")

OUT="$IN_DIR/\${BASE_NAME}_拼接.mkv"

echo "▶ 输出: $OUT"

docker run --rm -t \\
  -v /vol1:/vol1 \\
  -v /tmp:/tmp \\
  linuxserver/ffmpeg:latest \\
  -stats \\
  -f concat \\
  -safe 0 \\
  -i "$LIST" \\
  -c copy \\
  -y "$OUT"

if [ -s "$OUT" ]; then

    echo "🎉 拼接成功"

    sed "s/file '//;s/'$//" "$LIST" |
    while read -r src_file; do

        if [ -f "$src_file" ]; then
            rm -f "$src_file"
            echo "🗑️ 已删除: $(basename "$src_file")"
        fi

    done

else

    echo "❌ 拼接失败"
    echo "⚠️ 原文件未删除"

fi

rm -f "$LIST"`;


        document.getElementById("codeOutput").value =
            fullScript;

        return;

    }


    /*
     * ==========================================================
     * CUT
     * ==========================================================
     */

    if (mode === "cut") {

        let fullScript = "";


        if (cutAction === "keep") {

            let cutParams = "";

            if (startTime)
                cutParams += `-ss ${startTime} `;

            if (endTime)
                cutParams += `-to ${endTime} `;


            fullScript = `TARGET="${inPath}"
OUT_DIR="${outDir}"

mkdir -p "$OUT_DIR"

if [ -f "$TARGET" ]; then

    filename=$(basename -- "$TARGET")
    name="\${filename%.*}"

    out_file="$OUT_DIR/\${name}_cut.mkv"

    echo "✂️ 正在截取: $filename"

    docker run --rm -t \\
      -v /vol1:/vol1 \\
      linuxserver/ffmpeg:latest \\
      -stats ${cutParams}-i "$TARGET" \\
      -c copy \\
      -y "$out_file"

    if [ -s "$out_file" ]; then
        echo "🎉 截取完成: $out_file"
    else
        echo "❌ 截取失败"
    fi

else

    echo "❌ 文件不存在: $TARGET"

fi`;


        }


        else {

            fullScript = `TARGET="${inPath}"
OUT_DIR="${outDir}"

START_TIME="${startTime || "00:00:00"}"
END_TIME="${endTime}"

mkdir -p "$OUT_DIR"

if [ -z "$END_TIME" ]; then
    echo "❌ 必须填写结束时间"
    exit 1
fi

filename=$(basename -- "$TARGET")
name="\${filename%.*}"

part1="/tmp/\${name}_part1.mkv"
part2="/tmp/\${name}_part2.mkv"
list="/tmp/\${name}_list.txt"

docker run --rm -t \\
  -v /vol1:/vol1 \\
  -v /tmp:/tmp \\
  linuxserver/ffmpeg:latest \\
  -stats \\
  -to "$START_TIME" \\
  -i "$TARGET" \\
  -c copy \\
  -y "$part1"

docker run --rm -t \\
  -v /vol1:/vol1 \\
  -v /tmp:/tmp \\
  linuxserver/ffmpeg:latest \\
  -stats \\
  -ss "$END_TIME" \\
  -i "$TARGET" \\
  -c copy \\
  -y "$part2"

echo "file '$part1'" > "$list"
echo "file '$part2'" >> "$list"

docker run --rm -t \\
  -v /vol1:/vol1 \\
  -v /tmp:/tmp \\
  linuxserver/ffmpeg:latest \\
  -stats \\
  -f concat \\
  -safe 0 \\
  -i "$list" \\
  -c copy \\
  -y "$OUT_DIR/\${name}_removed.mkv"

rm -f "$part1" "$part2" "$list"`;


        }


        document.getElementById("codeOutput").value =
            fullScript;

        return;

    }


    /*
     * ==========================================================
     * TRANSCODE
     * ==========================================================
     */

    let qpVal = 23;
    let crfVal = 30;
    let presetVal = 6;

    if (quality === "quality") {

        qpVal = 21;
        crfVal = 24;
        presetVal = 4;

    }

    else if (quality === "size") {

        qpVal = 28;
        crfVal = 34;
        presetVal = 8;

    }


    const tag =
        codec === "h265"
            ? "_H265"
            : "_AV1";


    const scriptBody = `TARGET="${inPath}"
OUT_DIR="${outDir}"

mkdir -p "$OUT_DIR"

docker run --rm -t \\
  --device /dev/dri:/dev/dri \\
  -v /vol1:/vol1 \\
  linuxserver/ffmpeg:latest \\
  -init_hw_device qsv=hw \\
  -filter_hw_device hw \\
  -hwaccel qsv \\
  -hwaccel_output_format qsv \\
  -i "$TARGET" \\
  -stats \\
  -c:v hevc_qsv \\
  -preset faster \\
  -global_quality ${qpVal} \\
  -c:a copy \\
  -y "$OUT_DIR/output${tag}.mkv"`;


    document.getElementById("codeOutput").value =
        scriptBody;

}


/* ============================================================
   API 健康检查
   ============================================================ */

async function checkApi() {

    const status =
        document.getElementById("apiStatus");

    try {

        const response =
            await fetch(
                API_BASE + "/api/health",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok)
            throw new Error("API error");

        const data =
            await response.json();

        status.innerHTML =
            "🟢 N100 Docker API 在线";

        status.className =
            "api-status api-online";

        return true;

    }

    catch (error) {

        status.innerHTML =
            "🔴 N100 Docker API 无法连接";

        status.className =
            "api-status api-offline";

        return false;

    }

}


/* ============================================================
   主按钮
   ============================================================ */

async function handleMainButton() {

    const mode =
        document.querySelector(
            'input[name="transcodeMode"]:checked'
        ).value;


    /*
     * 转码模式：直接调用 API
     */

    if (mode === "transcode") {

        await startTranscode();

        return;

    }


    /*
     * CUT / MERGE 暂时继续复制命令
     */

    copyCode();

}


/* ============================================================
   开始转码
   ============================================================ */

async function startTranscode() {

    if (isRunning) {

        alert("当前已经有一个任务正在运行。");

        return;

    }


    const inputPath =
        document.getElementById("inputPath")
        .value
        .trim();

    const outputPath =
        document.getElementById("outputPath")
        .value
        .trim();

    const codec =
        document.querySelector(
            'input[name="codecMode"]:checked'
        ).value;

    const quality =
        document.getElementById("qualityPreset").value;

    const fps2x =
        document.getElementById("fps2x").checked;


    if (!inputPath) {

        alert("请输入原视频文件或文件夹路径。");

        return;

    }


    if (!inputPath.startsWith("/vol1/")) {

        alert(
            "为了安全，路径必须位于 /vol1/ 下。"
        );

        return;

    }


    if (
        outputPath &&
        !outputPath.startsWith("/vol1/")
    ) {

        alert(
            "输出路径必须位于 /vol1/ 下。"
        );

        return;

    }


    const apiOK =
        await checkApi();

    if (!apiOK) {

        alert(
            "无法连接 N100 Docker API。\n\n" +
            "请确认：\n" +
            "1. n100-transcoder-api 正在运行\n" +
            "2. 3015 端口正常\n" +
            "3. 当前设备可以访问 192.168.2.216"
        );

        return;

    }


    const btn =
        document.getElementById("copyBtn");

    const stopBtn =
        document.getElementById("stopBtn");

    const statusBox =
        document.getElementById("statusBox");

    const statusText =
        document.getElementById("statusText");

    const jobIdText =
        document.getElementById("jobIdText");

    const progressBar =
        document.getElementById("progressBar");

    const output =
        document.getElementById("codeOutput");


    isRunning = true;

    btn.disabled = true;
    btn.style.opacity = "0.6";
    btn.innerText = "⏳ 正在启动 N100...";

    stopBtn.style.display = "block";

    statusBox.style.display = "block";

    statusText.innerText =
        "⏳ 正在创建 Docker 压制任务...";

    jobIdText.innerText = "";

    progressBar.style.width = "0%";

    output.value =
        "正在连接 N100 Docker API...\n";


    /*
     * API 请求
     */

    try {

        const response =
            await fetch(
                API_BASE + "/api/transcode",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        mode: "transcode",

                        inputPath:
                            inputPath,

                        outputDir:
                            outputPath,

                        codec:
                            codec,

                        quality:
                            quality,

                        fps2x:
                            fps2x

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "启动任务失败"
            );

        }


        currentJobId =
            data.id ||
            data.jobId ||
            data.job_id;


        if (!currentJobId) {

            throw new Error(
                "API 没有返回任务 ID"
            );

        }


        jobIdText.innerText =
            "任务：" + currentJobId;

        statusText.innerText =
            "🟢 N100 正在压制";

        output.value +=
            "========================================\n" +
            "▶ 任务已启动\n" +
            "📁 输入：" + inputPath + "\n" +
            "📁 输出：" + outputPath + "\n" +
            "⚡ 编码：" +
            (codec === "h265"
                ? "H.265 / Intel QSV"
                : "AV1 / 软件编码") +
            "\n" +
            "🎚️ 质量：" + quality +
            "\n" +
            "⏩ 2倍帧率：" +
            (fps2x ? "开启" : "关闭") +
            "\n" +
            "========================================\n";


        startPolling();


    }

    catch (error) {

        console.error(error);

        statusText.innerText =
            "❌ 启动失败";

        output.value +=
            "\n❌ " +
            error.message +
            "\n";

        isRunning = false;

        btn.disabled = false;
        btn.style.opacity = "1";
        btn.innerText = "▶️ 开始转码";

        stopBtn.style.display = "none";

    }

}


/* ============================================================
   查询任务
   ============================================================ */

function startPolling() {

    if (pollTimer)
        clearInterval(pollTimer);


    pollJob();

    pollTimer =
        setInterval(
            pollJob,
            2000
        );

}


/* ============================================================
   获取任务状态
   ============================================================ */

async function pollJob() {

    if (!currentJobId)
        return;


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/jobs/" +
                encodeURIComponent(currentJobId),
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "读取任务状态失败"
            );

        }


        updateJobUI(data);


    }

    catch (error) {

        console.error(
            "poll error:",
            error
        );

    }

}


/* ============================================================
   更新任务 UI
   ============================================================ */

function updateJobUI(data) {

    const statusText =
        document.getElementById("statusText");

    const output =
        document.getElementById("codeOutput");

    const progressBar =
        document.getElementById("progressBar");

    const btn =
        document.getElementById("copyBtn");

    const stopBtn =
        document.getElementById("stopBtn");


    /*
     * 日志
     */

    let logText = "";


    if (Array.isArray(data.logs)) {

        logText =
            data.logs.join("\n");

    }

    else if (typeof data.logs === "string") {

        logText =
            data.logs;

    }

    else if (typeof data.log === "string") {

        logText =
            data.log;

    }


    if (logText) {

        output.value =
            logText;

        output.scrollTop =
            output.scrollHeight;

    }


    /*
     * 进度
     */

    let progress =
        Number(
            data.progress ||
            data.percent ||
            0
        );


    if (
        !isNaN(progress) &&
        progress >= 0 &&
        progress <= 100
    ) {

        progressBar.style.width =
            progress + "%";

    }


    /*
     * 状态
     */

    const status =
        String(
            data.status ||
            data.state ||
            ""
        ).toLowerCase();


    if (
        status === "completed" ||
        status === "success" ||
        status === "done"
    ) {

        statusText.innerText =
            "✅ 压制完成";

        progressBar.style.width =
            "100%";

        finishJob(
            "success"
        );

        return;

    }


    if (
        status === "failed" ||
        status === "error"
    ) {

        statusText.innerText =
            "❌ 压制失败";

        finishJob(
            "failed"
        );

        return;

    }


    if (
        status === "stopped" ||
        status === "cancelled" ||
        status === "canceled"
    ) {

        statusText.innerText =
            "⛔ 任务已停止";

        finishJob(
            "stopped"
        );

        return;

    }


    statusText.innerText =
        "🟢 N100 正在压制";


    btn.innerText =
        "⏳ 正在压制...";

}


/* ============================================================
   完成任务
   ============================================================ */

function finishJob(result) {

    if (pollTimer) {

        clearInterval(
            pollTimer
        );

        pollTimer = null;

    }


    isRunning = false;


    const btn =
        document.getElementById("copyBtn");

    const stopBtn =
        document.getElementById("stopBtn");


    btn.disabled = false;

    btn.style.opacity = "1";

    btn.innerText =
        "▶️ 开始转码";

    stopBtn.style.display =
        "none";


    if (result === "success") {

        btn.style.backgroundColor =
            "#16a34a";

        setTimeout(() => {

            btn.style.backgroundColor =
                "var(--btn-copy-bg)";

        }, 2500);

    }

}


/* ============================================================
   停止任务
   ============================================================ */

async function stopCurrentJob() {

    if (!currentJobId)
        return;


    if (
        !confirm(
            "确定要停止当前 N100 压制任务吗？"
        )
    ) {

        return;

    }


    const output =
        document.getElementById("codeOutput");

    const statusText =
        document.getElementById("statusText");


    statusText.innerText =
        "⛔ 正在停止任务...";


    try {

        const response =
            await fetch(
                API_BASE +
                "/api/jobs/" +
                encodeURIComponent(currentJobId) +
                "/stop",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "停止失败"
            );

        }


        output.value +=
            "\n\n⛔ 已发送停止任务请求。\n";


        statusText.innerText =
            "⛔ 正在停止...";


    }

    catch (error) {

        output.value +=
            "\n❌ 停止失败：" +
            error.message +
            "\n";

    }

}


/* ============================================================
   复制旧版命令
   ============================================================ */

function copyCode() {

    const codeArea =
        document.getElementById(
            "codeOutput"
        );

    const btn =
        document.getElementById(
            "copyBtn"
        );


    navigator.clipboard
        .writeText(
            codeArea.value
        )
        .then(() => {

            btn.innerText =
                "✅ 复制成功！";

            btn.style.backgroundColor =
                "#16a34a";


            setTimeout(() => {

                const mode =
                    document.querySelector(
                        'input[name="transcodeMode"]:checked'
                    ).value;


                if (mode === "transcode") {

                    btn.innerText =
                        "▶️ 开始转码";

                }

                else if (mode === "cut") {

                    btn.innerText =
                        "📋 复制截断命令";

                }

                else {

                    btn.innerText =
                        "📋 复制拼接命令";

                }


                btn.style.backgroundColor =
                    "var(--btn-copy-bg)";

            }, 2500);

        })

        .catch(() => {

            alert(
                "复制失败，请手动复制下面的命令。"
            );

        });

}


/* ============================================================
   初始化
   ============================================================ */

window.onload = async function () {

    switchMode();

    await checkApi();

};

</script>
