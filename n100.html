<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>N100 压制</title>

    <!-- iOS 专属全屏与状态栏配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="N100压制">

    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIkRvY2tlciBOMTAwIHBvc3QtcHJvY2VzcyIsCiAgInNob3J0X25hbWUiOiAiTjEwM壓制IiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwZjE3MmEiLAogICJ0aGVtZV9jb2xvciI6ICIjMGYxNzJhIgp9">

    <!-- iOS 桌面图标 -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='120' fill='%230f172a'/><path d='M380 200 C380 140 330 110 270 120 C240 80 170 90 150 140 C90 140 80 210 130 250 C110 290 150 340 210 330 C250 370 330 350 350 300 C390 280 400 220 380 200 Z' fill='%230284c7'/><circle cx='200' cy='210' r='12' fill='%23ffffff'/><path d='M350 280 Q380 260 410 285 Q390 310 350 280 Z' fill='%230284c7'/><path d='M160 380 L352 380' stroke='%2338bdf8' stroke-width='24' stroke-linecap='round'/><path d='M210 340 L160 380 L210 420' fill='none' stroke='%2338bdf8' stroke-width='24' stroke-linecap='round' stroke-linejoin='round'/></svg>">

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-accent: #38bdf8;
            --input-bg: #0f172a;
            --input-border: #475569;
            --code-bg: #050505;
            --code-text: #4ade80;
            --btn-paste-bg: #334155;
            --btn-paste-text: #38bdf8;
            --btn-paste-hover: #0284c7;
            --btn-copy-bg: #0284c7;
            --btn-copy-hover: #0369a1;
            --note-bg: rgba(56, 189, 248, 0.1);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-body: #f1f5f9;
                --bg-card: #ffffff;
                --border-color: #e2e8f0;
                --text-primary: #0f172a;
                --text-secondary: #64748b;
                --text-accent: #0284c7;
                --input-bg: #f8fafc;
                --input-border: #cbd5e1;
                --code-bg: #1e293b;
                --code-text: #4ade80;
                --btn-paste-bg: #e2e8f0;
                --btn-paste-text: #0284c7;
                --btn-paste-hover: #0284c7;
                --btn-copy-bg: #0284c7;
                --btn-copy-hover: #0369a1;
                --note-bg: #f0f9ff;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            padding-left: max(15px, env(safe-area-inset-left));
            padding-right: max(15px, env(safe-area-inset-right));
            transition: background-color 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        h2 { 
            margin-top: 0; 
            color: var(--text-accent); 
            border-bottom: 2px solid var(--border-color); 
            padding-bottom: 12px; 
            font-size: 20px;
        }

        .mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            background: var(--input-bg);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--input-border);
            flex-direction: column;
        }

        .mode-selector label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group { margin-bottom: 18px; }
        
        .time-group {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            flex-direction: column;
        }

        .time-item { flex: 1; }

        .label-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        label { font-weight: 600; color: var(--text-secondary); font-size: 13px; }
        
        .paste-btn-small {
            background-color: var(--btn-paste-bg);
            color: var(--btn-paste-text);
            border: 1px solid var(--input-border);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .paste-btn-small:hover {
            background-color: var(--btn-paste-hover);
            color: #ffffff;
            border-color: var(--btn-paste-hover);
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: var(--input-bg);
            color: var(--text-accent);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus, select:focus { 
            outline: none; 
            border-color: var(--text-accent); 
        }

        button#copyBtn {
            width: 100%;
            background-color: var(--btn-copy-bg);
            color: white;
            border: none;
            padding: 15px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button#copyBtn:hover { background-color: var(--btn-copy-hover); }
        
        textarea {
            width: 100%;
            height: 380px;
            padding: 12px;
            background-color: var(--code-bg);
            color: var(--code-text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            margin-top: 12px;
            line-height: 1.5;
        }

        .note {
            background-color: var(--note-bg);
            border-left: 4px solid var(--text-accent);
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🐳 Docker N100 压制控制台</h2>
    
    <div class="note" id="modeNote">
        💡 <b>智能转码：</b> 已开启 `-t` 与 `-stats` 实时进度打印。只要<b>新视频时长 ≥ 原视频80%</b>，即安全清理原文件。
    </div>

    <!-- 模式选择 -->
    <div class="section-title">📂 处理模式选择：</div>
    <div class="mode-selector">
        <label>
            <input type="radio" name="transcodeMode" value="transcode" checked onchange="switchMode()">
            🎬 智能转码模式 (时长对比 ≥ 80% 删源，封装 MKV)
        </label>
        <label>
            <input type="radio" name="transcodeMode" value="cut" onchange="switchMode()">
            ✂️ 视频截断模式 (保留或删除指定区间，封装 MKV)
        </label>
        <label>
            <input type="radio" name="transcodeMode" value="merge" onchange="switchMode()">
            🧩 视频无损拼接模式 (导出 MKV 封装，成功后删源)
        </label>
    </div>

    <!-- 编码格式与质量选择 -->
    <div id="codecSection">
        <div class="section-title">⚡ 编码格式与质量预设：</div>
        <div class="mode-selector">
            <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 4px;">
                <label><input type="radio" name="codecMode" value="h265" checked onchange="generateDockerCmd()"> 🚀 H.265 / HEVC (Intel QSV 硬件加速)</label>
                <label><input type="radio" name="codecMode" value="av1" onchange="generateDockerCmd()"> ⚙️ AV1 (libsvtav1 软解)</label>
            </div>
            <!-- 2倍帧率开关 -->
            <div style="margin-bottom: 8px;">
                <label style="color: var(--text-accent); font-weight: bold;">
                    <input type="checkbox" id="fps2x" onchange="generateDockerCmd()"> ⏩ 开启 2倍帧率 (通过 QSV VPP 动态精准翻倍)
                </label>
            </div>
            <div style="width: 100%;">
                <select id="qualityPreset" onchange="generateDockerCmd()">
                    <option value="medium" selected>⚖️ 转换预设：中等画质 (默认平衡 - Q23)</option>
                    <option value="quality">🎨 转换预设：高画质 (文件较大 - Q21)</option>
                    <option value="size">📦 转换预设：小体积 (极限压缩 - Q28)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 截割时间设置与动作选项 -->
    <div class="time-group" id="timeCutGroup" style="display: none;">
        <div class="section-title">✂️ 裁剪选项：</div>
        <div class="mode-selector">
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <label><input type="radio" name="cutAction" value="keep" checked onchange="generateDockerCmd()"> 📌 保留该时间段 (仅导出这段内容)</label>
                <label><input type="radio" name="cutAction" value="remove" onchange="generateDockerCmd()"> 🚫 删除该时间段 (裁掉此段，前后无损拼接)</label>
            </div>
        </div>
        <div style="display: flex; gap: 12px;">
            <div class="time-item">
                <label>⏱️ 起始时间 (如 00:05:00):</label>
                <input type="text" id="startTime" value="00:00:00" placeholder="例如: 00:00:00" oninput="generateDockerCmd()">
            </div>
            <div class="time-item">
                <label>⏱️ 结束时间 (如 00:10:00):</label>
                <input type="text" id="endTime" value="00:15:35" placeholder="例如: 00:15:35" oninput="generateDockerCmd()">
            </div>
        </div>
    </div>

    <!-- 输入路径控件 -->
    <div class="form-group">
        <div class="label-header">
            <label id="inputPathLabel">1. 原视频文件或文件夹路径：</label>
            <button class="paste-btn-small" onclick="pasteToInput('inputPath')">📋 粘贴</button>
        </div>
        <input type="text" id="inputPath" value="/vol1/1000/live/抖音/星辰" oninput="syncAndUpdateDir()">
    </div>

    <!-- 输出路径控件 -->
    <div class="form-group" id="outputGroup">
        <label id="outputPathLabel">2. 转换后输出文件夹路径 (已实时同步)：</label>
        <input type="text" id="outputPath" value="/vol1/1000/live/抖音/星辰" oninput="generateDockerCmd()">
    </div>

    <button id="copyBtn" onclick="copyCode()">📋 点击复制 Docker 执行命令</button>

    <textarea id="codeOutput" readonly></textarea>
</div>

<script>
    function switchMode() {
        const mode = document.querySelector('input[name="transcodeMode"]:checked').value;
        const inputLabel = document.getElementById('inputPathLabel');
        const outputLabel = document.getElementById('outputPathLabel');
        const codecSection = document.getElementById('codecSection');
        const outputGroup = document.getElementById('outputGroup');
        const timeCutGroup = document.getElementById('timeCutGroup');
        const modeNote = document.getElementById('modeNote');

        if (mode === 'transcode') {
            codecSection.style.display = 'block';
            outputGroup.style.display = 'block';
            timeCutGroup.style.display = 'none';
            inputLabel.innerText = "1. 原视频文件或文件夹路径：";
            outputLabel.innerText = "2. 转换后输出文件夹路径 (已实时同步)：";
            modeNote.innerHTML = "💡 <b>智能转码：</b> 已开启 `-t` 与 `-stats` 实时进度打印。只要<b>新视频时长 ≥ 原视频80%</b>，即安全清理原文件（统一封装为 MKV）。";
        } else if (mode === 'cut') {
            codecSection.style.display = 'none';
            outputGroup.style.display = 'block';
            timeCutGroup.style.display = 'block';
            inputLabel.innerText = "1. 目标视频文件或文件夹路径：";
            outputLabel.innerText = "2. 截断输出文件夹路径 (已实时同步)：";
            modeNote.innerHTML = "💡 <b>视频截断：</b> 可选择保留某片段，或直接剔除某时间段并将前后自动拼接（统一封装为 MKV）。";
        } else if (mode === 'merge') {
            codecSection.style.display = 'none';
            outputGroup.style.display = 'none';
            timeCutGroup.style.display = 'none';
            inputLabel.innerText = "1. 需要拼接视频的文件夹路径：";
            modeNote.innerHTML = "💡 <b>无损拼接：</b> 全面兼容 MP4/MKV/TS/FLV，拼接目标统一导出为 MKV 封装，成功后自动清理原始片段。";
        }
        syncAndUpdateDir();
    }

    async function pasteToInput(inputId) {
        try {
            const text = await navigator.clipboard.readText();
            if (text) {
                document.getElementById(inputId).value = text.trim();
                syncAndUpdateDir();
            }
        } catch (err) {
            alert('读取剪贴板失败，请手动粘贴。');
        }
    }

    function syncAndUpdateDir() {
        const mode = document.querySelector('input[name="transcodeMode"]:checked').value;
        const inPathVal = document.getElementById('inputPath').value.trim();
        const isFile = /\.(mp4|ts|flv|mkv)$/i.test(inPathVal);

        if (mode === 'merge' || !isFile) {
            document.getElementById('outputPath').value = inPathVal;
        } else {
            const lastSlashIndex = inPathVal.lastIndexOf('/');
            if (lastSlashIndex !== -1) {
                document.getElementById('outputPath').value = inPathVal.substring(0, lastSlashIndex);
            } else {
                document.getElementById('outputPath').value = inPathVal;
            }
        }
        generateDockerCmd();
    }

    function generateDockerCmd() {
        const mode = document.querySelector('input[name="transcodeMode"]:checked').value;
        const codec = document.querySelector('input[name="codecMode"]:checked').value;
        const isFps2x = document.getElementById('fps2x').checked;
        const quality = document.getElementById('qualityPreset').value;
        const inPath = document.getElementById('inputPath').value.trim();
        const outDir = document.getElementById('outputPath').value.trim();
        const startTime = document.getElementById('startTime').value.trim();
        const endTime = document.getElementById('endTime').value.trim();
        const cutAction = document.querySelector('input[name="cutAction"]:checked') ? document.querySelector('input[name="cutAction"]:checked').value : 'keep';

        if (mode === 'merge') {
            const fullScript = `IN_DIR="${inPath}"
LIST="/tmp/concat_list.txt"
> "$LIST"

echo "========================================================="
echo "▶ 1. 扫描并生成待拼接文件列表 (支持 MP4/MKV/TS/FLV)..."
echo "========================================================="

find "$IN_DIR" -maxdepth 1 -type f | grep -E "\\.(mp4|ts|mkv|flv|MP4|TS|MKV|FLV)$" | grep -v "_拼接\\." | sort | while read -r f; do
    echo "file '$f'" >> "$LIST"
    echo " ➕ 已添加: $(basename "$f")"
done

if [ ! -s "$LIST" ]; then
    echo "❌ 目录下没有找到可拼接的原始视频文件！"
    exit 1
fi

FIRST=$(head -n 1 "$LIST" | sed "s/file '//;s/'$//")
BASE_NAME=$(basename "\${FIRST%.*}")
OUT="$IN_DIR/\${BASE_NAME}_拼接.mkv"

echo "========================================================="
echo "▶ 2. 开始拼接，合成目标: \${BASE_NAME}_拼接.mkv"
echo "========================================================="

# 优先尝试无损解复用拼接为 MKV 封装
docker run --rm -t \\
  --device /dev/dri:/dev/dri \\
  -v /vol1:/vol1 \\
  -v /tmp:/tmp \\
  linuxserver/ffmpeg:latest \\
  -stats -f concat -safe 0 -i "$LIST" -c copy -bsf:v hevc_mp4toannexb -y "$OUT" || \\
docker run --rm -t \\
  --device /dev/dri:/dev/dri \\
  -v /vol1:/vol1 \\
  -v /tmp:/tmp \\
  linuxserver/ffmpeg:latest \\
  -stats -f concat -safe 0 -i "$LIST" -c copy -y "$OUT" || \\
docker run --rm -t \\
  --device /dev/dri:/dev/dri \\
  -v /vol1:/vol1 \\
  -v /tmp:/tmp \\
  linuxserver/ffmpeg:latest \\
  -stats -init_hw_device qsv=hw -filter_hw_device hw \\
  -f concat -safe 0 -i "$LIST" \\
  -c:v hevc_qsv -preset faster -global_quality 23 -c:a aac -y "$OUT"

if [ -s "$OUT" ]; then
    echo "========================================================="
    echo "🎉 拼接成功！合成视频已生成: $OUT"
    echo "🗑️  正在清理参与拼接的原始文件..."
    echo "========================================================="
    
    sed "s/file '//;s/'$//" "$LIST" | while read -r src_file; do
        if [ -f "$src_file" ]; then
            rm -f "$src_file"
            echo " 🗑️  已删除原文件: $(basename "$src_file")"
        fi
    done
    echo "✨ 原始文件清理完毕！"
else
    echo "❌ 拼接失败！取消删除原文件！"
fi

rm -f "$LIST"`;

            document.getElementById('codeOutput').value = fullScript;
            return;
        }

        if (mode === 'cut') {
            let fullScript = "";
            if (cutAction === 'keep') {
                let cutParams = "";
                if (startTime) cutParams += `-ss ${startTime} `;
                if (endTime) cutParams += `-to ${endTime} `;

                fullScript = `TARGET="${inPath}"
OUT_DIR="${outDir}"

mkdir -p "$OUT_DIR"

if [ -f "$TARGET" ]; then
    filename=$(basename -- "$TARGET")
    name="\${filename%.*}"
    out_file="$OUT_DIR/\${name}_cut.mkv"

    echo "========================================================="
    echo "✂️ 正在截取指定片段: $filename"
    echo "⏱️ 保留区间: ${startTime || '开头'} -> ${endTime || '结尾'}"
    echo "========================================================="

    docker run --rm -t -v /vol1:/vol1 linuxserver/ffmpeg:latest -stats ${cutParams}-i "$TARGET" -c copy -y "$out_file"

    if [ -s "$out_file" ]; then
        echo "🎉 截取完成！输出文件: $out_file"
    else
        echo "❌ 截取失败！"
    fi
elif [ -d "$TARGET" ]; then
    echo "========================================================="
    echo "✂️ 识别为文件夹，批量进行片段截取..."
    echo "========================================================="

    for video in "$TARGET"/*; do
        [ -e "$video" ] || continue
        filename=$(basename -- "$video")
        name="\${filename%.*}"
        ext="\${filename##*.}"
        ext_lower=$(echo "$ext" | tr "[:upper:]" "[:lower:]")

        if [[ "$name" == *"_cut"* ]] || [[ "$ext_lower" != "mp4" && "$ext_lower" != "ts" && "$ext_lower" != "flv" && "$ext_lower" != "mkv" ]]; then
            continue
        fi

        out_file="$OUT_DIR/\${name}_cut.mkv"

        echo "▶ 处理文件: $filename"
        docker run --rm -t -v /vol1:/vol1 linuxserver/ffmpeg:latest -stats ${cutParams}-i "$video" -c copy -y "$out_file"
    done
    echo "🎉 批量截取完成！"
else
    echo "❌ 路径不存在: $TARGET"
fi`;
            } else {
                fullScript = `TARGET="${inPath}"
OUT_DIR="${outDir}"
START_TIME="${startTime || '00:00:00'}"
END_TIME="${endTime}"

if [ -z "$END_TIME" ]; then
    echo "❌ 删除片段模式下，必须填入【结束时间】！"
    exit 1
fi

mkdir -p "$OUT_DIR"

cut_and_merge() {
    local src="$1"
    local fname=$(basename -- "$src")
    local bname="\${fname%.*}"
    local final_out="$OUT_DIR/\${bname}_removed.mkv"
    local part1="/tmp/p1_\$\$.mkv"
    local part2="/tmp/p2_\$\$.mkv"
    local list_file="/tmp/list_\$\$.txt"

    echo "========================================================="
    echo "✂️ 正在剔除片段: $fname"
    echo "🚫 删除区间: $START_TIME -> $END_TIME"
    echo "========================================================="

    docker run --rm -t -v /vol1:/vol1 -v /tmp:/tmp linuxserver/ffmpeg:latest -stats -to "$START_TIME" -i "$src" -c copy -y "$part1"
    docker run --rm -t -v /vol1:/vol1 -v /tmp:/tmp linuxserver/ffmpeg:latest -stats -ss "$END_TIME" -i "$src" -c copy -y "$part2"

    echo "file '$part1'" > "$list_file"
    echo "file '$part2'" >> "$list_file"

    docker run --rm -t -v /vol1:/vol1 -v /tmp:/tmp linuxserver/ffmpeg:latest -stats -f concat -safe 0 -i "$list_file" -c copy -y "$final_out"

    rm -f "$part1" "$part2" "$list_file"

    if [ -s "$final_out" ]; then
        echo "🎉 片段剔除并无损拼接完成！输出文件: $final_out"
    else
        echo "❌ 处理失败！"
    fi
}

if [ -f "$TARGET" ]; then
    cut_and_merge "$TARGET"
elif [ -d "$TARGET" ]; then
    for video in "$TARGET"/*; do
        [ -e "$video" ] || continue
        filename=$(basename -- "$video")
        ext="\${filename##*.}"
        ext_lower=$(echo "$ext" | tr "[:upper:]" "[:lower:]")
        if [[ "$filename" == *"_removed"* ]] || [[ "$ext_lower" != "mp4" && "$ext_lower" != "ts" && "$ext_lower" != "flv" && "$ext_lower" != "mkv" ]]; then
            continue
        fi
        cut_and_merge "$video"
    done
else
    echo "❌ 路径不存在: $TARGET"
fi`;
            }

            document.getElementById('codeOutput').value = fullScript;
            return;
        }

        // 转码质量与速度预设
        let qpVal = 23; 
        let crfVal = 30;
        let presetVal = 6;
        let qsvPreset = "faster"; 

        if (quality === 'quality') {
            qpVal = 21;    
            crfVal = 24;
            presetVal = 4;
            qsvPreset = "fast";
        } else if (quality === 'size') {
            qpVal = 28;    
            crfVal = 34;
            presetVal = 8;
            qsvPreset = "veryfast";
        }

        const tag = (codec === 'h265' ? '_H265' : '_AV1');
        const tagAlt = (codec === 'h265' ? '-H265' : '-AV1');

        const scriptBody = `TARGET="${inPath}"
OUT_DIR="${outDir}"

mkdir -p "$OUT_DIR"

process_video() {
    local src="$1"
    local filename=$(basename -- "$src")
    local name="\${filename%.*}"
    local out_file="$OUT_DIR/\${name}${tag}.mkv"

    echo "========================================================="
    echo "🚀 正在高功率全速压制: $filename"
    echo "========================================================="

    ${codec === 'h265' ? `
    # 提取原始帧率（锁定视频流 v:0）
    fps_raw=\$(docker run --rm -v /vol1:/vol1 linuxserver/ffmpeg:latest ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=noprint_wrappers=1:nokey=1 "$src" 2>/dev/null | head -n 1)

    ${isFps2x ? `
    # 计算 2 倍目标帧率
    fps_target=\$(awk -F'/' 'BEGIN {FS="/"} {
      if (\$2>0) val=(\$1/\$2)*2; 
      else if (\$1>0) val=\$1*2; 
      else val=60; 
      res=int(val+0.5); 
      if (res<=0) res=60; 
      print res
    }' <<< "\$fps_raw")
    echo "▶ 原始帧率字符串: \$fps_raw | 2倍目标帧率: \$fps_target"

    docker run --rm -t --device /dev/dri:/dev/dri -v /vol1:/vol1 linuxserver/ffmpeg:latest \\
      -init_hw_device qsv=hw -filter_hw_device hw \\
      -hwaccel qsv -hwaccel_output_format qsv \\
      -i "$src" \\
      -stats \\
      -vf "vpp_qsv=framerate=\$fps_target" \\
      -r "\$fps_target" \\
      -c:v hevc_qsv -preset ${qsvPreset} -global_quality ${qpVal} \\
      -c:a copy -y "$out_file"
    ` : `
    docker run --rm -t --device /dev/dri:/dev/dri -v /vol1:/vol1 linuxserver/ffmpeg:latest \\
      -init_hw_device qsv=hw -filter_hw_device hw \\
      -hwaccel qsv -hwaccel_output_format qsv \\
      -i "$src" \\
      -stats \\
      -c:v hevc_qsv -preset ${qsvPreset} -global_quality ${qpVal} \\
      -c:a copy -y "$out_file"
    `}
    ` : `
    # AV1 软解转码逻辑
    docker run --rm -t -v /vol1:/vol1 linuxserver/ffmpeg:latest \\
      -i "$src" \\
      -stats \\
      ${isFps2x ? '-vf "fps=60" ' : ''}-c:v libsvtav1 -crf ${crfVal} -preset ${presetVal} \\
      -c:a copy -y "$out_file"
    `}

    if [ -s "$out_file" ]; then
        # 提取时长并用 cut 取整秒，彻底解决浮点数隐式比对报错
        duration_orig=\$(docker run --rm -v /vol1:/vol1 linuxserver/ffmpeg:latest ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$src" 2>/dev/null | cut -d. -f1)
        duration_out=\$(docker run --rm -v /vol1:/vol1 linuxserver/ffmpeg:latest ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$out_file" 2>/dev/null | cut -d. -f1)
        
        if [ -n "$duration_orig" ] && [ -n "$duration_out" ] && [ "$duration_orig" -gt 0 ]; then
            min_target=\$(( duration_orig * 80 / 100 ))
            if [ "$duration_out" -ge "$min_target" ]; then
                echo "⚠️ 压制成功（原时长: \${duration_orig}s, 新时长: \${duration_out}s，通过 ≥80% 校验）！自动清理原文件: $filename"
                rm -f "$src"
            else
                echo "❌ 压制时长不足（原: \${duration_orig}s, 新: \${duration_out}s），保留原文件: $filename"
            fi
        else
            echo "⚠️ 无法精确提取时长，但新文件生成正常，自动清理原文件: $filename"
            rm -f "$src"
        fi
    else
        echo "❌ 压制失败，保留原文件: $filename"
    fi
}

if [ -f "$TARGET" ]; then
    process_video "$TARGET"
elif [ -d "$TARGET" ]; then
    echo "========================================================="
    echo "▶ 识别为文件夹，开始全速批量压制..."
    echo "========================================================="

    for video in "$TARGET"/*; do
        [ -e "$video" ] || continue
        filename=$(basename -- "$video")
        ext="\${filename##*.}"
        ext_lower=\$(echo "$ext" | tr "[:upper:]" "[:lower:]")
        name="\${filename%.*}"
        
        if [[ "$name" == *${tag}* ]] || [[ "$name" == *${tagAlt}* ]]; then
            continue
        fi

        if [ "$ext_lower" != "ts" ] && [ "$ext_lower" != "mp4" ] && [ "$ext_lower" != "flv" ] && [ "$ext_lower" != "mkv" ]; then
            continue
        fi

        process_video "$video"
    done
    echo "🎉 批量处理完成！"
else
    echo "❌ 找不到指定路径 -> $TARGET"
fi`;

        document.getElementById('codeOutput').value = scriptBody;
    }

    function copyCode() {
        const codeArea = document.getElementById('codeOutput');
        const btn = document.getElementById('copyBtn');
        
        navigator.clipboard.writeText(codeArea.value).then(() => {
            btn.innerText = "✅ 复制成功！可以直接粘贴到终端运行";
            btn.style.backgroundColor = "#16a34a";
            setTimeout(() => {
                btn.innerText = "📋 点击复制 Docker 执行命令";
                btn.style.backgroundColor = "var(--btn-copy-bg)";
            }, 2500);
        });
    }

    window.onload = switchMode;
</script>

</body>
</html>
